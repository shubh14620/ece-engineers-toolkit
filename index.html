<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ECE Toolkit</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  font-family: Arial;
  background: #0f172a;
  color: white;
  text-align: center;
}

.container {
  display: flex;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
}

.card {
  background: #1e293b;
  padding: 20px;
  border-radius: 10px;
  width: 300px;
}

input, textarea {
  width: 90%;
  margin: 5px;
  padding: 8px;
}

button {
  background: #22c55e;
  color: white;
  padding: 8px;
  border: none;
  margin: 5px;
}
</style>
</head>

<body>

<h1>⚡ ECE – The Engineer’s Toolkit</h1>

<div class="container">

<div class="card">
<h3>Calculator</h3>
<input id="voltage" placeholder="Voltage">
<input id="resistance" placeholder="Resistance">
<button onclick="ohm()">Ohm</button>

<input id="current" placeholder="Current">
<button onclick="power()">Power</button>

<div id="calcOutput"></div>
</div>

<div class="card">
<h3>Graph</h3>
<button onclick="drawGraph()">Generate</button>
<canvas id="chart"></canvas>
</div>

<div class="card">
<h3>Analyzer</h3>
<textarea id="text"></textarea>
<button onclick="analyze()">Analyze</button>
<div id="analysis"></div>
</div>

</div>

<script>

let chart;

function ohm(){
 let v = document.getElementById("voltage").value;
 let r = document.getElementById("resistance").value;
 document.getElementById("calcOutput").innerHTML = v/r;
}

function power(){
 let v = document.getElementById("voltage").value;
 let i = document.getElementById("current").value;
 document.getElementById("calcOutput").innerHTML = v*i;
}

function drawGraph(){
 let ctx = document.getElementById("chart").getContext("2d");

 if(chart) chart.destroy();

 chart = new Chart(ctx,{
  type:"line",
  data:{
   labels:[1,2,3,4,5],
   datasets:[{
    label:"Signal",
    data:[1,3,2,5,4]
   }]
  }
 });
}

function analyze(){
 let text = document.getElementById("text").value;
 document.getElementById("analysis").innerHTML = text.length;
}

</script>

</body>
</html>
