<!DOCTYPE html>
<html>
<head>
<title>ECE Pro Toolkit</title>

<style>
body {
  margin:0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
}

/* NAVBAR */
.navbar {
  text-align:center;
  padding:15px;
  font-size:24px;
  font-weight:bold;
  background:rgba(0,0,0,0.7);
}

/* TABS */
.tabs {
  display:flex;
  justify-content:center;
  gap:10px;
  margin:10px;
}

.tabs button {
  padding:10px;
  border:none;
  background:#22c55e;
  color:white;
  border-radius:5px;
  cursor:pointer;
}

/* CONTAINER */
.container {
  display:flex;
  justify-content:center;
  padding:20px;
}

.card {
  background:rgba(255,255,255,0.05);
  padding:20px;
  border-radius:15px;
  width:350px;
  box-shadow:0 0 20px rgba(0,255,150,0.2);
}

input {
  width:95%;
  padding:8px;
  margin:5px 0;
  border:none;
  border-radius:6px;
}

button.calc {
  width:100%;
  padding:10px;
  margin-top:5px;
}

.output {
  margin-top:10px;
  color:#22c55e;
  font-weight:bold;
}

/* HIDE */
.section {
  display:none;
}

.active {
  display:block;
}

/* CANVAS */
canvas {
  width:100%;
  height:200px;
  background:white;
  border-radius:10px;
}

/* FOOTER */
footer {
  text-align:center;
  padding:15px;
  font-size:14px;
  opacity:0.8;
}
</style>
</head>

<body>

<div class="navbar">⚡ ECE Pro Toolkit</div>

<div class="tabs">
<button onclick="show('calc')">Calculators</button>
<button onclick="show('circuit')">Circuit Builder</button>
</div>

<div class="container">

<!-- CALCULATOR SECTION -->
<div id="calc" class="card section active">

<h3>⚡ Basic Calculations</h3>

<input id="V" placeholder="Voltage (V)">
<input id="R" placeholder="Resistance (Ω)">
<button class="calc" onclick="current()">Calculate Current</button>

<input id="I" placeholder="Current (A)">
<button class="calc" onclick="power()">Calculate Power</button>

<div class="output" id="out1"></div>

<hr>

<h3>🔧 RC Circuit</h3>

<input id="r" placeholder="Resistance (Ω)">
<input id="c" placeholder="Capacitance (F)">
<button class="calc" onclick="rc()">Calculate τ</button>

<div class="output" id="out2"></div>

<hr>

<h3>📡 Frequency</h3>

<input id="f" placeholder="Frequency (Hz)">
<button class="calc" onclick="freq()">Calculate Period</button>

<div class="output" id="out3"></div>

</div>

<!-- CIRCUIT BUILDER -->
<div id="circuit" class="card section">

<h3>🔌 Circuit Builder</h3>

<button onclick="add('resistor')">Resistor</button>
<button onclick="add('capacitor')">Capacitor</button>
<button onclick="reset()">Reset</button>

<canvas id="canvas"></canvas>

</div>

</div>

<footer>
©️ 2026 ECE Pro Toolkit | Developed by Shubham Pandey ⚡  
All Rights Reserved.
</footer>

<script>

// TAB SWITCH
function show(id){
document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
document.getElementById(id).classList.add('active');
}

// CALCULATORS
function current(){
let V=V_input(),R=R_input();
if(!V||!R) return alert("Enter values");
out1.innerHTML="I = "+(V/R).toFixed(2)+" A";
}

function power(){
let V=V_input(),I=I_input();
if(!V||!I) return alert("Enter values");
out1.innerHTML="P = "+(V*I).toFixed(2)+" W";
}

function rc(){
let R=r.value,C=c.value;
out2.innerHTML="τ = "+(R*C).toExponential(2)+" sec";
}

function freq(){
let fval=f.value;
out3.innerHTML="T = "+(1/fval).toFixed(4)+" sec";
}

// INPUT HELPERS
function V_input(){return parseFloat(document.getElementById("V").value)}
function R_input(){return parseFloat(document.getElementById("R").value)}
function I_input(){return parseFloat(document.getElementById("I").value)}

// CIRCUIT BUILDER
let ctx=document.getElementById("canvas").getContext("2d");
let x=20,y=100;

function add(type){
ctx.strokeStyle="black";
ctx.beginPath();
ctx.moveTo(x,y);
ctx.lineTo(x+20,y);
ctx.stroke();
x+=20;

if(type==="resistor"){
for(let i=0;i<4;i++){
ctx.lineTo(x+10,y-10);
ctx.lineTo(x+20,y+10);
x+=20;
}
}

if(type==="capacitor"){
ctx.moveTo(x,y-15);
ctx.lineTo(x,y+15);
ctx.moveTo(x+10,y-15);
ctx.lineTo(x+10,y+15);
x+=20;
}

ctx.stroke();
ctx.beginPath();
ctx.moveTo(x,y);
ctx.lineTo(x+20,y);
ctx.stroke();
x+=20;
}

function reset(){
ctx.clearRect(0,0,400,200);
x=20;
}

</script>

</body>
</html>
