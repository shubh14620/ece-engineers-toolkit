<!DOCTYPE html>
<html>
<head>
<title>ECE Super Toolkit</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  margin:0;
  font-family: Arial;
  background: linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
  text-align:center;
}

.navbar {
  padding:15px;
  font-size:22px;
  font-weight:bold;
  background:rgba(0,0,0,0.5);
}

.container {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:20px;
  padding:20px;
}

.card {
  background:rgba(255,255,255,0.05);
  padding:20px;
  border-radius:15px;
  width:300px;
}

input {
  width:90%;
  padding:8px;
  margin:5px;
  border:none;
  border-radius:5px;
}

button {
  background:#22c55e;
  color:white;
  border:none;
  padding:8px 15px;
  margin:5px;
  border-radius:5px;
  cursor:pointer;
}

canvas {
  margin-top:10px;
}
</style>
</head>

<body>

<div class="navbar">⚡ ECE Super Toolkit</div>

<div class="container">

<!-- Calculator -->
<div class="card">
<h3>Calculators</h3>

<input id="voltage" placeholder="Voltage (V)">
<input id="resistance" placeholder="Resistance (Ω)">
<button onclick="ohm()">Ohm</button>

<input id="current" placeholder="Current (A)">
<button onclick="power()">Power</button>

<div id="out"></div>

<hr>

<h3>RC Circuit</h3>
<input id="r" placeholder="Resistance (Ω)">
<input id="c" placeholder="Capacitance (F)">
<button onclick="rc()">Calculate</button>
<div id="rcOut"></div>

<hr>

<h3>Frequency</h3>
<input id="freq" placeholder="Frequency (Hz)">
<button onclick="period()">Period</button>
<div id="freqOut"></div>

</div>

<!-- Graph -->
<div class="card">
<h3>Graph Engine</h3>

<button onclick="graph('sine')">Sine</button>
<button onclick="graph('square')">Square</button>
<button onclick="graph('triangle')">Triangle</button>
<button onclick="graph('rc')">RC Curve</button>
<button onclick="graph('am')">AM Signal</button>

<canvas id="chart"></canvas>

</div>

</div>

<script>

// Ohm
function ohm(){
let V=voltage.value;
let R=resistance.value;
out.innerHTML="Current = "+(V/R)+" A";
}

// Power
function power(){
let V=voltage.value;
let I=current.value;
out.innerHTML="Power = "+(V*I)+" W";
}

// RC
function rc(){
let R=r.value;
let C=c.value;
rcOut.innerHTML="τ = "+(R*C)+" sec";
}

// Frequency
function period(){
let f=freq.value;
freqOut.innerHTML="T = "+(1/f)+" sec";
}

// Graph
function graph(type){

const ctx=document.getElementById('chart').getContext('2d');

if(window.g) g.destroy();

let labels=[],data=[];

for(let i=0;i<100;i++){
let t=i/10;
labels.push(t);

if(type=="sine") data.push(Math.sin(t));
if(type=="square") data.push(Math.sign(Math.sin(t)));
if(type=="triangle") data.push(2*Math.asin(Math.sin(t))/Math.PI);
if(type=="rc") data.push(1-Math.exp(-t));
if(type=="am"){
let c=Math.sin(10*t);
let m=Math.sin(t);
data.push((1+m)*c);
}
}

g=new Chart(ctx,{
type:'line',
data:{
labels:labels,
datasets:[{
label:type,
data:data,
borderWidth:2
}]
}
});
}

</script>

</body>
</html>
