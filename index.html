<!DOCTYPE html>
<html>
<head>
<title>ECE – Engineer's Toolkit</title>

<style>
body {
  margin:0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
  text-align:center;
}

.navbar {
  padding:15px;
  font-size:24px;
  font-weight:bold;
  background:rgba(0,0,0,0.7);
}

.container {
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(300px,1fr));
  gap:20px;
  padding:20px;
}

.card {
  background:rgba(255,255,255,0.05);
  padding:20px;
  border-radius:15px;
  box-shadow:0 0 20px rgba(0,255,150,0.2);
}

input {
  width:95%;
  padding:8px;
  margin:5px 0;
  border:none;
  border-radius:6px;
}

button {
  width:100%;
  padding:10px;
  background:#22c55e;
  border:none;
  color:white;
  border-radius:6px;
  margin-top:5px;
  cursor:pointer;
}

.output {
  margin-top:10px;
  color:#22c55e;
  font-weight:bold;
}

footer {
  margin-top:20px;
  padding:15px;
  font-size:14px;
  opacity:0.8;
}
</style>
</head>

<body>

<div class="navbar">⚡ ECE – Engineer’s Toolkit</div>

<div class="container">

<!-- OHM -->
<div class="card">
<h3>Ohm's Law</h3>
<input id="V" placeholder="Voltage (V)">
<input id="I" placeholder="Current (A)">
<input id="R" placeholder="Resistance (Ω)">
<button onclick="ohm()">Calculate</button>
<div class="output" id="o1"></div>
</div>

<!-- POWER -->
<div class="card">
<h3>Power</h3>
<input id="v1" placeholder="Voltage (V)">
<input id="i1" placeholder="Current (A)">
<button onclick="power()">Calculate</button>
<div class="output" id="o2"></div>
</div>

<!-- RC -->
<div class="card">
<h3>RC Time Constant</h3>
<input id="r" placeholder="R">
<input id="c" placeholder="C">
<button onclick="rc()">Calculate</button>
<div class="output" id="o3"></div>
</div>

<!-- FREQUENCY -->
<div class="card">
<h3>Frequency</h3>
<input id="f" placeholder="Frequency">
<button onclick="freq()">Calculate</button>
<div class="output" id="o4"></div>
</div>

<!-- XC -->
<div class="card">
<h3>Capacitive Reactance</h3>
<input id="fc" placeholder="Frequency">
<input id="cap" placeholder="Capacitance">
<button onclick="xc()">Calculate</button>
<div class="output" id="o5"></div>
</div>

<!-- XL -->
<div class="card">
<h3>Inductive Reactance</h3>
<input id="fl" placeholder="Frequency">
<input id="L" placeholder="Inductance">
<button onclick="xl()">Calculate</button>
<div class="output" id="o6"></div>
</div>

<!-- RLC -->
<div class="card">
<h3>Resonance</h3>
<input id="Lr" placeholder="L">
<input id="Cr" placeholder="C">
<button onclick="rlc()">Calculate</button>
<div class="output" id="o7"></div>
</div>

<!-- VOLTAGE DIVIDER -->
<div class="card">
<h3>Voltage Divider</h3>
<input id="Vin" placeholder="Input Voltage">
<input id="R1" placeholder="R1">
<input id="R2" placeholder="R2">
<button onclick="vd()">Calculate</button>
<div class="output" id="o8"></div>
</div>

<!-- CURRENT DIVIDER -->
<div class="card">
<h3>Current Divider</h3>
<input id="Iin" placeholder="Input Current">
<input id="Ra" placeholder="R1">
<input id="Rb" placeholder="R2">
<button onclick="cd()">Calculate</button>
<div class="output" id="o9"></div>
</div>

<!-- IMPEDANCE -->
<div class="card">
<h3>Impedance</h3>
<input id="res" placeholder="Resistance">
<input id="react" placeholder="Reactance">
<button onclick="imp()">Calculate</button>
<div class="output" id="o10"></div>
</div>

<!-- GAIN -->
<div class="card">
<h3>Gain</h3>
<input id="Vo" placeholder="Output Voltage">
<input id="Vi" placeholder="Input Voltage">
<button onclick="gain()">Calculate</button>
<div class="output" id="o11"></div>
</div>

<!-- dB -->
<div class="card">
<h3>dB</h3>
<input id="g" placeholder="Gain">
<button onclick="db()">Calculate</button>
<div class="output" id="o12"></div>
</div>

<!-- BANDWIDTH -->
<div class="card">
<h3>Bandwidth</h3>
<input id="fh" placeholder="High Freq">
<input id="flw" placeholder="Low Freq">
<button onclick="bw()">Calculate</button>
<div class="output" id="o13"></div>
</div>

</div>

<footer>
©️ 2026 ECE – Engineer’s Toolkit | Developed by Shubham Pandey ⚡  
All Rights Reserved.
</footer>

<script>

// Existing
function ohm(){let V=+V.value,I=+I.value,R=+R.value;
if(V&&I)o1.innerHTML="R="+(V/I);
else if(V&&R)o1.innerHTML="I="+(V/R);
else if(I&&R)o1.innerHTML="V="+(I*R);
}

function power(){o2.innerHTML="P="+(v1.value*i1.value);}
function rc(){o3.innerHTML="τ="+(r.value*c.value);}
function freq(){o4.innerHTML="T="+(1/f.value);}
function xc(){o5.innerHTML="Xc="+(1/(2*Math.PI*fc.value*cap.value));}
function xl(){o6.innerHTML="Xl="+(2*Math.PI*fl.value*L.value);}
function rlc(){o7.innerHTML="f="+(1/(2*Math.PI*Math.sqrt(Lr.value*Cr.value)));}

// NEW
function vd(){o8.innerHTML="Vout="+(Vin.value*(R2.value/(+R1.value+ +R2.value)));}
function cd(){o9.innerHTML="Iout="+(Iin.value*(Rb.value/(+Ra.value+ +Rb.value)));}
function imp(){o10.innerHTML="Z="+Math.sqrt(res.value**2+react.value**2);}
function gain(){o11.innerHTML="Av="+(Vo.value/Vi.value);}
function db(){o12.innerHTML="dB="+(20*Math.log10(g.value));}
function bw(){o13.innerHTML="BW="+(fh.value-flw.value);}

</script>

</body>
</html>
