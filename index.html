<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ECE – The Engineer’s Toolkit</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg,#0f172a,#1e293b);
  color: white;
  text-align: center;
}

.navbar {
  position: sticky;
  top: 0;
  background: rgba(0,0,0,0.5);
  padding: 15px;
  font-size: 22px;
  font-weight: bold;
}

.container {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 20px;
  padding: 20px;
}

.card {
  background: rgba(255,255,255,0.05);
  padding: 20px;
  border-radius: 15px;
  width: 300px;
}

input, textarea {
  width: 90%;
  padding: 8px;
  margin: 5px;
  border-radius: 5px;
  border: none;
}

button {
  background: #22c55e;
  border: none;
  padding: 8px 15px;
  margin: 5px;
  color: white;
  border-radius: 5px;
  cursor: pointer;
}

#calcOutput, #rcOutput, #freqOutput, #analysis {
  margin-top: 10px;
  font-weight: bold;
}

footer {
  margin-top: 20px;
  padding: 10px;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="navbar">⚡ ECE – The Engineer’s Toolkit</div>

<div class="container">

<!-- Calculator -->
<div class="card">
<h3>Calculator</h3>

<input type="number" id="voltage" placeholder="Voltage (V)">
<input type="number" id="resistance" placeholder="Resistance (Ω)">
<button onclick="calculateOhm()">Ohm</button>

<input type="number" id="current" placeholder="Current (A)">
<button onclick="calculatePower()">Power</button>

<div id="calcOutput"></div>

<hr>

<h3>RC Circuit</h3>
<input type="number" id="resistor" placeholder="Resistance (Ω)">
<input type="number" id="capacitor" placeholder="Capacitance (F)">
<button onclick="calculateRC()">RC</button>
<div id="rcOutput"></div>

<hr>

<h3>Frequency</h3>
<input type="number" id="freq" placeholder="Frequency (Hz)">
<button onclick="calculatePeriod()">Period</button>
<div id="freqOutput"></div>

</div>

<!-- Graph -->
<div class="card">
<h3>Graph</h3>
<button onclick="generateGraph()">Generate</button>
<canvas id="chart"></canvas>
</div>

<!-- Analyzer -->
<div class="card">
<h3>Analyzer</h3>
<textarea id="textInput" placeholder="Paste text..."></textarea>
<button onclick="analyzeText()">Analyze</button>
<div id="analysis"></div>
</div>

</div>

<footer>
©️ 2026 ECE – The Engineer’s Toolkit | Developed by Shubham Pandey ⚡ All Rights Reserved.
</footer>

<script>

// Ohm's Law
function calculateOhm() {
  let V = document.getElementById("voltage").value;
  let R = document.getElementById("resistance").value;

  let I = V / R;

  document.getElementById("calcOutput").innerHTML = "Current = " + I + " A";
}

// Power
function calculatePower() {
  let V = document.getElementById("voltage").value;
  let I = document.getElementById("current").value;

  let P = V * I;

  document.getElementById("calcOutput").innerHTML = "Power = " + P + " W";
}

// RC Circuit
function calculateRC() {
  let R = document.getElementById("resistor").value;
  let C = document.getElementById("capacitor").value;

  let tau = R * C;

  document.getElementById("rcOutput").innerHTML = "τ = " + tau + " sec";
}

// Frequency
function calculatePeriod() {
  let f = document.getElementById("freq").value;

  let T = 1 / f;

  document.getElementById("freqOutput").innerHTML = "T = " + T + " sec";
}

// Graph (Sine Wave)
function generateGraph() {
  const ctx = document.getElementById('chart').getContext('2d');

  if (window.myChart) {
    window.myChart.destroy();
  }

  let labels = [];
  let data = [];

  for (let i = 0; i <= 10; i++) {
    labels.push(i);
    data.push(Math.sin(i));
  }

  window.myChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: labels,
      datasets: [{
        label: 'Sine Wave',
        data: data,
        borderWidth: 2
      }]
    }
  });
}

// Analyzer
function analyzeText() {
  let text = document.getElementById("textInput").value;

  let words = text.trim().split(/\s+/).length;
  let characters = text.length;
  let sentences = text.split(/[.!?]+/).length - 1;

  document.getElementById("analysis").innerHTML =
    "Words: " + words + "<br>" +
    "Characters: " + characters + "<br>" +
    "Sentences: " + sentences;
}

</script>

</body>
</html>
